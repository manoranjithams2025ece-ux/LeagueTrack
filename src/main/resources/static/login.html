<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>LeagueTrack | Sign In</title>

    <link rel="stylesheet" href="css/style.css">

    <style>

        /* ===============================
           LOGIN PAGE
        =============================== */

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }


        /* Background glow */

        .glow-one,
        .glow-two,
        .glow-three {

            position: fixed;

            border-radius: 50%;

            pointer-events: none;

            filter: blur(10px);

        }


        .glow-one {

            width: 420px;
            height: 420px;

            background:
                    rgba(0, 212, 255, 0.10);

            top: -180px;
            left: -120px;

        }


        .glow-two {

            width: 500px;
            height: 500px;

            background:
                    rgba(124, 58, 237, 0.10);

            bottom: -250px;
            right: -180px;

        }


        .glow-three {

            width: 220px;
            height: 220px;

            background:
                    rgba(0, 212, 255, 0.06);

            top: 45%;
            right: 18%;

        }


        /* ===============================
           DECORATIVE LINES
        =============================== */

        .background-lines {

            position: fixed;

            inset: 0;

            pointer-events: none;

            opacity: 0.25;

        }


        .line {

            position: absolute;

            height: 1px;

            background:
                    linear-gradient(
                            90deg,
                            transparent,
                            rgba(0, 212, 255, 0.35),
                            transparent
                    );

            transform: rotate(-25deg);

        }


        .line-one {

            width: 700px;

            top: 20%;

            left: -150px;

        }


        .line-two {

            width: 600px;

            bottom: 22%;

            right: -100px;

            transform:
                    rotate(25deg);

        }


        .line-three {

            width: 450px;

            top: 65%;

            left: 15%;

            transform:
                    rotate(-15deg);

        }


        /* ===============================
           MAIN LOGIN
        =============================== */

        .login-wrapper {

            width: 92%;

            max-width: 460px;

            position: relative;

            z-index: 5;

        }


        .login-card {

            padding: 48px 45px;

            background:
                    rgba(6, 16, 30, 0.92);

            border:
                    1px solid
                    rgba(255, 255, 255, 0.11);

            border-radius: 24px;

            backdrop-filter:
                    blur(25px);

            box-shadow:
                    0 30px 90px
                    rgba(0, 0, 0, 0.55);

        }


        /* ===============================
           BRAND
        =============================== */

        .brand {

            text-align: center;

            margin-bottom: 38px;

        }


        .brand-name {

            font-size: 32px;

            font-weight: 800;

            letter-spacing: -1px;

            color: white;

        }


        .brand-name span {

            color:
                    var(--primary);

        }


        .brand-line {

            width: 45px;

            height: 3px;

            margin: 10px auto 0;

            border-radius: 10px;

            background:
                    var(--primary);

        }


        /* ===============================
           HEADING
        =============================== */

        .login-heading {

            margin-bottom: 28px;

        }


        .login-heading h1 {

            font-size: 28px;

            margin-bottom: 8px;

        }


        .login-heading p {

            color:
                    var(--muted);

            font-size: 14px;

            line-height: 1.6;

        }


        /* ===============================
           INPUT
        =============================== */

        .field {

            margin-bottom: 20px;

        }


        .field label {

            display: block;

            margin-bottom: 8px;

            color:
                    #cbd5e1;

            font-size: 13px;

            font-weight: 600;

        }


        .input-container {

            position: relative;

        }


        .input-container .form-control {

            height: 48px;

            padding-left: 16px;

            background:
                    rgba(255,255,255,0.035);

            border:
                    1px solid
                    rgba(255,255,255,0.10);

            transition:
                    0.3s;

        }


        .input-container .form-control:focus {

            background:
                    rgba(0,212,255,0.035);

            border-color:
                    var(--primary);

            box-shadow:
                    0 0 0 3px
                    rgba(0,212,255,0.07);

        }


        /* ===============================
           LOGIN BUTTON
        =============================== */

        .login-button {

            width: 100%;

            height: 50px;

            margin-top: 8px;

            border-radius: 10px;

            font-size: 14px;

            letter-spacing: 0.2px;

        }


        .login-button:hover {

            transform:
                    translateY(-2px);

        }


        /* ===============================
           MESSAGE
        =============================== */

        .login-message {

            min-height: 20px;

            margin-top: 17px;

            text-align: center;

            font-size: 13px;

            font-weight: 600;

        }


        /* ===============================
           BOTTOM INFO
        =============================== */

        .bottom-info {

            margin-top: 30px;

            padding-top: 20px;

            border-top:
                    1px solid
                    rgba(255,255,255,0.07);

            text-align: center;

        }


        .bottom-info p {

            color:
                    #64748b;

            font-size: 11px;

            line-height: 1.7;

        }


        .status-dot {

            display: inline-block;

            width: 6px;

            height: 6px;

            border-radius: 50%;

            background:
                    #22c55e;

            margin-right: 6px;

        }


        /* ===============================
           RESPONSIVE
        =============================== */

        @media (max-width: 500px) {

            .login-card {

                padding: 38px 25px;

            }

            .brand-name {

                font-size: 28px;

            }

            .login-heading h1 {

                font-size: 25px;

            }

        }

    </style>

</head>


<body>


<!-- Background decoration -->

<div class="glow-one"></div>

<div class="glow-two"></div>

<div class="glow-three"></div>


<div class="background-lines">

    <div class="line line-one"></div>

    <div class="line line-two"></div>

    <div class="line line-three"></div>

</div>


<!-- ===============================
     LOGIN
================================ -->

<div class="login-wrapper">

    <div class="login-card">


        <!-- BRAND -->

        <div class="brand">

            <div class="brand-name">

                League<span>Track</span>

            </div>

            <div class="brand-line"></div>

        </div>


        <!-- HEADING -->

        <div class="login-heading">

            <h1>
                Sign in to continue
            </h1>

            <p>
                Access your tournament management
                dashboard and keep everything on track.
            </p>

        </div>


        <!-- FORM -->

        <form id="loginForm">


            <!-- USERNAME -->

            <div class="field">

                <label for="username">
                    Username
                </label>

                <div class="input-container">

                    <input
                            type="text"
                            id="username"
                            class="form-control"
                            placeholder="Enter your username"
                            autocomplete="username"
                            required
                    >

                </div>

            </div>


            <!-- PASSWORD -->

            <div class="field">

                <label for="password">
                    Password
                </label>

                <div class="input-container">

                    <input
                            type="password"
                            id="password"
                            class="form-control"
                            placeholder="Enter your password"
                            autocomplete="current-password"
                            required
                    >

                </div>

            </div>


            <!-- BUTTON -->

            <button
                    type="submit"
                    class="btn btn-primary login-button"
            >
                Sign In
            </button>


        </form>


        <!-- MESSAGE -->

        <div
                id="loginMessage"
                class="login-message"
        ></div>


        <!-- FOOTER -->

        <div class="bottom-info">

            <p>

                <span class="status-dot"></span>

                Tournament system ready

            </p>

            <p style="margin-top: 5px;">

                LeagueTrack • 2026

            </p>

        </div>


    </div>

</div>


<!-- ===============================
     LOGIN SCRIPT
================================ -->

<script>

    const USERNAME = "MANO";

    const PASSWORD = "MANO2421";


    document
        .getElementById("loginForm")
        .addEventListener(
            "submit",
            function(event) {

                event.preventDefault();


                const username =
                    document.getElementById(
                        "username"
                    ).value.trim();


                const password =
                    document.getElementById(
                        "password"
                    ).value;


                const message =
                    document.getElementById(
                        "loginMessage"
                    );


                if (
                    username === USERNAME &&
                    password === PASSWORD
                ) {

                    message.textContent =
                        "Login successful. Opening dashboard...";

                    message.style.color =
                        "var(--success)";


                    setTimeout(
                        function() {

                            window.location.href =
                                "index.html";

                        },
                        600
                    );

                }

                else {

                    message.textContent =
                        "Invalid username or password.";

                    message.style.color =
                        "var(--danger)";

                }

            }
        );

</script>


</body>

</html>
