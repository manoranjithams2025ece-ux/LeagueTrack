spring.application.name=leaguetrack

# MySQL Database Connection
spring.datasource.url=jdbc:mysql://localhost:3306/leaguetrack?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=YOUR_MYSQL_PASSWORD

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# League Scoring Rules
league.scoring.win=3
league.scoring.draw=1
league.scoring.loss=0

# Swagger / OpenAPI
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.packages-to-scan=com.leaguetrack.controller
springdoc.paths-to-match=/api/**